version: "1.0"
profile:
  base:
    name: empty
  groups:
    - groupId: PluginRegressions
      inspections:
        - QodanaSanity
        - HighlightVisitorInternal
  inspections:
    - group: PluginRegressions
      enabled: true
      ignore:
        - "**/*.bash"
        - "**/*.def"
        - "**/*.ft"
        - "**/*.http"
        - "**/*.ignore"
        - "**/*.json"
        - "**/*.ndjson"
        - "**/*.ps1"
        - "**/*.rest"
        - "**/*.rnc"
        - "**/*.sh"
        - "**/*.template"
        - "**/*.toml"
        - "**/*.vm"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.zsh"
failureConditions:
  severityThresholds:
    critical: 1
